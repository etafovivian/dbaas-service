version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - cyclop
    - exhaustive
    - noctx
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 15
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-naming
          disabled: true
    gosec:
      excludes:
        - G115
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - wrapcheck
      - path: migrations/embed\.go
        linters:
          - unused
      - text: "avoid package names that conflict"
        linters:
          - revive
